[project]
name = "pyrelatio"
version = "0.1.0"
description = "A mini relational database in Python: systems programming, storage internals, and optimization."
readme = "README.md"
authors = [
    { name = "Giorgi Chapidze", email = "chapidze.giorgi@proton.me" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
pyrelatio = "pyrelatio:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
